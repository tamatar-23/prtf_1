name: Update GitHub Contributions Daily

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Update GitHub Contributions
        run: node scripts/fetch-github-activity.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/lib/github-data.ts
          if git diff --staged --quiet; then
            echo "No contribution changes detected."
          else
            git commit -m "chore: auto-update github contributions [skip ci]"
            git push
          fi
